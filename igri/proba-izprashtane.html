<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Проба изпращане</title>
<style>
body{margin:0;background:#1d3a33;color:#f4f1e8;font-family:"Segoe UI",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:24px}
p{line-height:1.5;color:#cfdcd6}
button{display:block;width:100%;font:inherit;font-size:17px;font-weight:700;margin:10px 0;padding:14px;border-radius:10px;border:0;background:#f4f1e8;color:#1d3a33;cursor:pointer}
#log{background:#27493f;border-radius:10px;padding:10px 12px;min-height:3em;white-space:pre-wrap;font-size:14px}
a{color:#ffd84d}
</style>
</head>
<body>
<main>
<h1>Проба: изпращане към скрипта</h1>
<p>Натиснете трите бутона един след друг. Никой от тях не праща писмо. След това отворете <a id="ex" target="_blank" rel="noopener">връзката на скрипта</a> и вижте какво е получено.</p>
<button id="b1">1. Малка проба (fetch)</button>
<button id="b2">2. Малка проба (форма)</button>
<button id="b3">3. Голяма проба, 1 MB (форма)</button>
<div id="log" role="status"></div>
<p>Версия на страницата: 1</p>
</main>
<script>
const URL_='https://script.google.com/macros/s/AKfycbyiG7NDZZKULsHwE1he0khXmAkgyh6KOvcNoPtvl9WV48x6E9t6PcPKxK6VQeA1gfuXNA/exec';
const $=id=>document.getElementById(id);
$('ex').href=URL_;
const log=t=>{$('log').textContent+=new Date().toLocaleTimeString('bg-BG')+' – '+t+'\n'};
// Данните нарочно не са валиден JSON: скриптът записва „ГРЕШКА при JSON (N знака)“ и не праща писмо.
function postForm(data){
  return new Promise(ok=>{
    const n='tf'+Date.now(),ifr=document.createElement('iframe'),f=document.createElement('form'),i=document.createElement('input');
    ifr.name=n;ifr.style.display='none';f.method='POST';f.action=URL_;f.target=n;f.style.display='none';
    i.type='hidden';i.name='data';i.value=data;f.appendChild(i);document.body.append(ifr,f);
    let d=false;const fin=r=>{if(d)return;d=true;ok(r);setTimeout(()=>{ifr.remove();f.remove()},2000)};
    ifr.onload=()=>fin('iframe зареди отговор');setTimeout(()=>fin('няма отговор до 25 с'),25000);f.submit();
  });
}
$('b1').onclick=async()=>{log('1: изпращам…');
  try{await fetch(URL_,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:'y'.repeat(20)});log('1: заявката е тръгнала (очаквайте „JSON (20 знака)“)')}
  catch(e){log('1: грешка – '+(e&&e.message||e))}};
$('b2').onclick=async()=>{log('2: изпращам…');log('2: '+await postForm('x'.repeat(10))+' (очаквайте „JSON (10 знака)“)')};
$('b3').onclick=async()=>{log('3: изпращам 1 MB…');log('3: '+await postForm('x'.repeat(1000000))+' (очаквайте „JSON (1000000 знака)“)')};
</script>
</body>
</html>
